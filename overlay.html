<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:transparent; font-family:'Bebas Neue',sans-serif; overflow:hidden; width:100vw; height:100vh; }
  #overlay-container { position:absolute; bottom:24px; left:24px; display:flex; flex-direction:column; gap:10px; }

  .widget { background:rgba(0,0,0,0.72); border-left:4px solid #fff; padding:10px 18px 10px 14px; display:flex; align-items:center; gap:12px; backdrop-filter:blur(6px); border-radius:0 6px 6px 0; min-width:160px; transition:opacity 0.3s; }
  .widget.hidden { opacity:0; pointer-events:none; }
  .widget-label { font-family:'Inter',sans-serif; font-size:11px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:rgba(255,255,255,0.55); white-space:nowrap; }
  .widget-value { font-size:32px; color:#fff; letter-spacing:0.04em; line-height:1; white-space:nowrap; }

  #timer-widget { border-left-color:#5B9EFF; }
  #text-widget { border-left-color:#FF6B6B; }
  #text-widget .widget-value { font-size:22px; font-family:'Inter',sans-serif; font-weight:600; max-width:320px; word-break:break-word; white-space:normal; line-height:1.2; }

  /* KOTH */
  #koth-widget { border-left-color:#C084FC; flex-direction:column; align-items:flex-start; gap:6px; padding:12px 18px 12px 14px; }
  .koth-king-row { display:flex; align-items:baseline; gap:10px; }
  .koth-king-name { font-size:30px; color:#C084FC; letter-spacing:0.04em; }
  .koth-king-streak { font-size:20px; color:rgba(255,255,255,0.4); font-family:'Inter',sans-serif; font-weight:700; }
  .koth-king-label { font-size:11px; color:rgba(255,255,255,0.3); font-family:'Inter',sans-serif; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; }

  /* LEADERBOARD */
  #leaderboard-widget { border-left-color:#F59E0B; flex-direction:column; align-items:flex-start; gap:0; padding:12px 18px 12px 14px; min-width:220px; }
  #leaderboard-widget .widget-label { margin-bottom:8px; }
  .lb-row { display:flex; align-items:center; gap:10px; width:100%; padding:4px 0; border-bottom:1px solid rgba(255,255,255,0.06); }
  .lb-row:last-child { border-bottom:none; }
  .lb-pos { font-size:13px; width:22px; text-align:center; font-family:'Inter',sans-serif; color:rgba(255,255,255,0.4); font-weight:700; }
  .lb-name { flex:1; font-size:18px; color:#fff; }
  .lb-wins { font-size:18px; color:#F59E0B; }
  .lb-wins-label { font-size:10px; color:rgba(255,255,255,0.3); font-family:'Inter',sans-serif; margin-left:2px; }
  .lb-empty { font-size:13px; font-family:'Inter',sans-serif; color:rgba(255,255,255,0.3); }

  /* SCOREBOARD */
  #score-widget {
    border-left-color:#818CF8;
    flex-direction:column;
    align-items:stretch;
    gap:0;
    padding:0;
    overflow:hidden;
    min-width:260px;
    background:linear-gradient(135deg,rgba(15,10,40,0.92) 0%,rgba(30,20,60,0.92) 100%);
    border-left-width:4px;
  }
  .score-header { font-family:'Inter',sans-serif; font-size:10px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:rgba(255,255,255,0.4); text-align:center; padding:7px 18px 4px; border-bottom:1px solid rgba(255,255,255,0.06); }
  .score-main { display:flex; align-items:center; justify-content:space-between; padding:10px 16px 8px; gap:8px; }
  .score-team { display:flex; flex-direction:column; align-items:center; gap:3px; flex:1; }
  .score-flag { font-size:26px; line-height:1; }
  .score-name { font-family:'Inter',sans-serif; font-size:11px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.7); }
  .score-center { display:flex; align-items:center; gap:6px; }
  .score-num { font-size:42px; color:#fff; letter-spacing:0.02em; line-height:1; min-width:32px; text-align:center; text-shadow:0 0 20px rgba(129,140,248,0.8); transition:transform 0.15s ease; }
  @keyframes goalFlash { 0%{transform:scale(1);color:#fff} 30%{transform:scale(1.4);color:#818CF8;text-shadow:0 0 30px #818CF8,0 0 60px #818CF8} 100%{transform:scale(1);color:#fff} }
  .score-num.goal-flash { animation:goalFlash 0.6s ease; }
  .score-divider { font-size:24px; color:rgba(255,255,255,0.25); font-family:'Inter',sans-serif; font-weight:300; }
  .score-nextup { font-family:'Inter',sans-serif; font-size:10px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.35); text-align:center; padding:4px 16px 8px; border-top:1px solid rgba(255,255,255,0.06); }
  .score-nextup span { color:#818CF8; font-weight:700; }
  .score-glow-bar { height:2px; background:linear-gradient(90deg,transparent,#818CF8,#5B9EFF,#818CF8,transparent); opacity:0.6; }

  @keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.08)} 100%{transform:scale(1)} }
  .updated { animation:pulse 0.3s ease; }
  #status { position:fixed; top:8px; right:8px; font-family:'Inter',sans-serif; font-size:10px; font-weight:600; padding:3px 8px; border-radius:20px; background:rgba(0,0,0,0.5); color:#00E5A0; }
  #status.offline { color:#FF6B6B; }

  /* GIVEAWAY WINNER */
  #giveaway-widget {
    border-left-color:#22C55E;
    flex-direction:column;
    align-items:flex-start;
    gap:4px;
    padding:12px 18px 12px 14px;
  }
  .gw-winner-overlay-label { font-family:'Inter',sans-serif; font-size:11px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:rgba(255,255,255,0.55); }
  .gw-winner-overlay-name { font-size:36px; color:#22C55E; letter-spacing:0.04em; line-height:1.1; }
  .gw-winner-overlay-sub { font-family:'Inter',sans-serif; font-size:12px; color:rgba(255,255,255,0.4); font-weight:600; letter-spacing:0.08em; text-transform:uppercase; }
  @keyframes winnerPop { 0%{transform:scale(0.5);opacity:0} 70%{transform:scale(1.1)} 100%{transform:scale(1);opacity:1} }
  .winner-pop { animation:winnerPop 0.5s ease forwards; }

  /* OUTFIT WIDGET */
  #outfit-widget {
    border-left-color:#A78BFA;
    flex-direction:column;
    align-items:stretch;
    gap:0;
    padding:0;
    overflow:hidden;
    min-width:200px;
    max-width:320px;
    background:rgba(0,0,0,0.85);
  }
  .outfit-img-wrap {
    width:100%;
    max-height:380px;
    overflow:hidden;
    position:relative;
  }
  .outfit-img-wrap img {
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .outfit-label-bar {
    padding:8px 14px;
    background:linear-gradient(135deg,rgba(20,10,50,0.95),rgba(40,20,80,0.95));
    border-top:1px solid rgba(167,139,250,0.3);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .outfit-label-dot { width:6px; height:6px; border-radius:50%; background:#A78BFA; flex-shrink:0; box-shadow:0 0 6px #A78BFA; }
  .outfit-label-text { font-family:'Inter',sans-serif; font-size:13px; font-weight:700; color:#fff; letter-spacing:0.06em; text-transform:uppercase; }
  @keyframes outfitSlideIn { from{opacity:0;transform:translateX(-18px)} to{opacity:1;transform:translateX(0)} }
  .outfit-animate { animation:outfitSlideIn 0.4s ease forwards; }
</style>
</head>
<body>
<div id="status">VERBINDE...</div>
<div id="overlay-container">
</div>

  <div class="widget" id="timer-widget">
    <div class="widget-label">Zeit</div>
    <div class="widget-value" id="timer-display">00:00</div>
  </div>

  <div class="widget" id="text-widget">
    <div class="widget-label">Info</div>
    <div class="widget-value" id="custom-text">Willkommen im Stream!</div>
  </div>

  <div class="widget" id="koth-widget">
    <div class="widget-label">King of the Hill</div>
    <div class="koth-king-row">
      <span class="koth-king-name" id="koth-king-name">–</span>
      <span class="koth-king-streak" id="koth-king-streak"></span>
    </div>
    <div class="koth-king-label" id="koth-king-sublabel"></div>
  </div>

  <div class="widget" id="leaderboard-widget">
    <div class="widget-label">Leaderboard – Most Wins</div>
    <div id="lb-rows"><div class="lb-empty">Noch keine Daten</div></div>
  </div>

  <div class="widget hidden" id="score-widget">
    <div class="score-glow-bar"></div>
    <div class="score-header" id="score-match-label">Frankreich vs Marokko</div>
    <div class="score-main">
      <div class="score-team">
        <div class="score-flag" id="score-flag1">🇫🇷</div>
        <div class="score-name" id="score-name1">FRA</div>
      </div>
      <div class="score-center">
        <div class="score-num" id="score-num1">0</div>
        <div class="score-divider">:</div>
        <div class="score-num" id="score-num2">0</div>
      </div>
      <div class="score-team">
        <div class="score-flag" id="score-flag2">🇲🇦</div>
        <div class="score-name" id="score-name2">MAR</div>
      </div>
    </div>
    <div class="score-nextup" id="score-nextup-row">Next Up: <span id="score-nextup-text">–</span></div>
    <div class="score-glow-bar"></div>
  </div>

  <div class="widget" id="outfit-widget">
    <div class="outfit-img-wrap" id="outfit-img-wrap" style="min-height:200px;">
      <img id="outfit-img" src="" alt="outfit" style="width:100%;max-height:420px;object-fit:cover;display:block;" onload="this.style.display='block'" onerror="document.getElementById('outfit-img-wrap').style.background='rgba(255,0,0,0.2)'">
    </div>
    <div class="outfit-label-bar">
      <div class="outfit-label-dot"></div>
      <div class="outfit-label-text" id="outfit-label">Outfit</div>
    </div>
  </div>

  <div class="widget hidden" id="giveaway-widget">
    <div class="gw-winner-overlay-label">Gewinner</div>
    <div class="gw-winner-overlay-name" id="gw-overlay-name"></div>
    <div class="gw-winner-overlay-sub">Giveaway</div>
  </div>

</div>
<script>
  const SUPABASE_URL = 'https://rixbciqwdmwailqzingf.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJpeGJjaXF3ZG13YWlscXppbmdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNjk1ODYsImV4cCI6MjA5NTg0NTU4Nn0.Ao8EDjHF-8qbpeinKmlwDGaU_1eacaTvdigY6KjbF-0';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  let timerRunning=false, timerSeconds=0, timerInterval=null;

  function formatTime(s){ const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60; if(h>0)return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; return`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; }
  function pulse(id){ const el=document.getElementById(id); if(!el)return; el.classList.remove('updated'); void el.offsetWidth; el.classList.add('updated'); }

  function renderKoth(d) {
    const nameEl = document.getElementById('koth-king-name');
    const streakEl = document.getElementById('koth-king-streak');
    const subEl = document.getElementById('koth-king-sublabel');
    nameEl.textContent = d.kingName || '–';
    if(d.kingName && d.kingStreak > 0) {
      streakEl.textContent = d.kingStreak + ' W';
      subEl.textContent = 'aktuelle streak';
    } else {
      streakEl.textContent = '';
      subEl.textContent = d.kingName ? 'kein win noch' : '';
    }
    pulse('koth-king-name');
  }

  function renderLeaderboard(board) {
    const container = document.getElementById('lb-rows');
    if(!board || board.length===0){ container.innerHTML='<div class="lb-empty">Noch keine Daten</div>'; return; }
    const sorted = [...board].sort((a,b)=>b.wins-a.wins).slice(0,5);
    const positions = ['1.','2.','3.','4.','5.'];
    container.innerHTML = sorted.map((p,i)=>`
      <div class="lb-row">
        <span class="lb-pos">${positions[i]}</span>
        <span class="lb-name">${p.name}</span>
        <span class="lb-wins">${p.wins}</span>
        <span class="lb-wins-label">W</span>
      </div>`).join('');
  }

  function handleMsg(d) {
    if(d.type==='timer'){
      if(d.action==='start'){if(!timerRunning){timerRunning=true;timerInterval=setInterval(()=>{timerSeconds++;document.getElementById('timer-display').textContent=formatTime(timerSeconds);},1000);}}
      else if(d.action==='pause'){timerRunning=false;clearInterval(timerInterval);}
      else if(d.action==='reset'){timerRunning=false;clearInterval(timerInterval);timerSeconds=0;document.getElementById('timer-display').textContent='00:00';}
    }
    if(d.type==='text'){document.getElementById('custom-text').textContent=d.value;pulse('custom-text');}
    if(d.type==='koth'){renderKoth(d);}
    if(d.type==='leaderboard'){renderLeaderboard(d.board);}

    if(d.type==='giveaway'){
      const el = document.getElementById('giveaway-widget');
      const nameEl = document.getElementById('gw-overlay-name');
      if(d.winner) {
        nameEl.textContent = d.winner;
        nameEl.classList.remove('winner-pop');
        void nameEl.offsetWidth;
        nameEl.classList.add('winner-pop');
        el.classList.remove('hidden');
      } else {
        el.classList.add('hidden');
        nameEl.textContent = '';
      }
    }
    if(d.type==='score'){
      const s1=document.getElementById('score-num1');
      const s2=document.getElementById('score-num2');
      if(d.score1!==undefined){ const old=s1.textContent; s1.textContent=d.score1; if(String(d.score1)!==old){s1.classList.remove('goal-flash');void s1.offsetWidth;s1.classList.add('goal-flash');} }
      if(d.score2!==undefined){ const old=s2.textContent; s2.textContent=d.score2; if(String(d.score2)!==old){s2.classList.remove('goal-flash');void s2.offsetWidth;s2.classList.add('goal-flash');} }
      if(d.team1name!==undefined){ document.getElementById('score-name1').textContent=d.team1name; }
      if(d.team2name!==undefined){ document.getElementById('score-name2').textContent=d.team2name; }
      if(d.flag1!==undefined){ document.getElementById('score-flag1').textContent=d.flag1; }
      if(d.flag2!==undefined){ document.getElementById('score-flag2').textContent=d.flag2; }
      if(d.label!==undefined){ document.getElementById('score-match-label').textContent=d.label; }
      if(d.nextup!==undefined){ document.getElementById('score-nextup-text').textContent=d.nextup||'–'; }
    }
    if(d.type==='outfit'){
      const widget = document.getElementById('outfit-widget');
      const img = document.getElementById('outfit-img');
      const labelEl = document.getElementById('outfit-label');
      if(d.url){
        widget.classList.remove('hidden');
        labelEl.textContent = d.label || 'Outfit';
        img.src = '';
        setTimeout(() => {
          img.src = d.url + '?t=' + Date.now();
          img.classList.remove('outfit-animate');
          void img.offsetWidth;
          img.classList.add('outfit-animate');
        }, 50);
        console.log('OUTFIT IMG SRC SET:', d.url);
      } else {
        widget.classList.add('hidden');
        img.src = '';
      }
    }
    if(d.type==='visibility'){const el=document.getElementById(d.widget);if(el)el.classList.toggle('hidden',!d.visible);}
  }

  let channel = null;
  let reconnectTimer = null;

  function connect(){
    if(channel){ sb.removeChannel(channel); }
    channel = sb.channel('stream-overlay',{config:{broadcast:{self:false}}});
    channel.on('broadcast',{event:'update'},({payload})=>handleMsg(payload))
      .subscribe((status)=>{
        const s=document.getElementById('status');
        if(status==='SUBSCRIBED'){
          s.textContent='LIVE';
          s.classList.remove('offline');
          if(reconnectTimer){ clearTimeout(reconnectTimer); reconnectTimer=null; }
        } else if(status==='CLOSED' || status==='CHANNEL_ERROR' || status==='TIMED_OUT'){
          s.textContent='OFFLINE';
          s.classList.add('offline');
          if(!reconnectTimer){ reconnectTimer=setTimeout(()=>{ reconnectTimer=null; connect(); },3000); }
        } else {
          s.textContent='VERBINDE...';
        }
      });
  }
  connect();
</script>
</body>
</html>
